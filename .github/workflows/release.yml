name: Release

# Publishes to PyPI when a version tag is pushed (git tag v1.0.0 && git push --tags).
# Uses PyPI Trusted Publishing: no API token is stored anywhere. One-time setup
# on pypi.org > Account > Publishing > "Add a new pending publisher":
#   PyPI project name: hyperdata-terminal
#   Owner: Co-Messi   Repository: HyperData-Terminal
#   Workflow: release.yml   Environment: pypi
#
# Nothing is published unless the tagged commit passes the same checks as CI
# (the hashed lock, pip check, ruff, the dependency audit and the full test
# suite on every supported Python) and the built wheel passes the smoke test.
# PyPI releases cannot be replaced, so a red tag must never reach it.

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the hashed lock
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          pip install pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.15.20 pip-audit==2.10.1

      - name: Verify the installed set is consistent
        run: pip check

      - name: Lint
        run: ruff check hyperdata_terminal/ tests/ run_api.py run_dashboard.py

      - name: Dependency vulnerability audit
        run: pip-audit --require-hashes --disable-pip -r requirements.lock

      - name: Run tests
        run: python -m pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Tag must match the package version
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('hyperdata_terminal/__init__.py').read_text()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match hyperdata_terminal.__version__ ($version)"; exit 1
          fi

      - name: Build sdist and wheel
        run: |
          pip install --require-hashes -r .github/build-requirements.txt
          python -m build

      - name: Smoke test the wheel from outside the checkout
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/hyperdata --version
          /tmp/clean/bin/hyperdata-terminal --version
          /tmp/clean/bin/hyperdata --help > /dev/null
          /tmp/clean/bin/hyperdata paper --help > /dev/null
          /tmp/clean/bin/hyperdata verify --help > /dev/null
          /tmp/clean/bin/hyperdata alerts > /dev/null
          set +e; /tmp/clean/bin/hyperdata alerts --test > /dev/null 2>&1; code=$?; set -e
          if [ "$code" != "2" ]; then echo "alerts --test without channels exited $code, expected 2"; exit 1; fi
          /tmp/clean/bin/python -m hyperdata_terminal --version
          /tmp/clean/bin/python -c "import hyperdata_terminal.cli, hyperdata_terminal.terminal, hyperdata_terminal.mcp_server, hyperdata_terminal.api_server, hyperdata_terminal.verify_data, hyperdata_terminal.strategies.paper_trader, hyperdata_terminal.strategies.llm_agent, hyperdata_terminal.data_layer.hub"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hyperdata-terminal/
    permissions:
      id-token: write  # OIDC token for Trusted Publishing; nothing else
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
