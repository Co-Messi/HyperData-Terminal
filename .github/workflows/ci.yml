name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        # "lock": requirements.lock, every package (the mcp extra and all
        # transitive dependencies included) pinned and hash checked; the
        # package itself goes on top without resolving, so a dependency the
        # lock is missing fails `pip check` below instead of being fetched.
        # "pyproject": plain `pip install -e ".[mcp]"`, i.e. what a user gets
        # from PyPI with the MCP extra. Both must pass.
        install: ["lock"]
        include:
          - python-version: "3.13"
            install: "pyproject"

    steps:
      # Actions pinned by commit SHA (not mutable tags) so a compromised tag
      # can't inject code into CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (${{ matrix.install }})
        # Test tooling is pinned so CI is deterministic.
        run: |
          if [ "${{ matrix.install }}" = "lock" ]; then
            pip install --require-hashes -r requirements.lock
            pip install --no-deps -e .
          else
            pip install -e ".[mcp]"
          fi
          pip install pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.15.20 pip-audit==2.10.1

      - name: Verify the installed set is consistent
        # Fails on any dependency conflict — e.g. a lock pin outside the
        # range pyproject.toml declares.
        run: pip check

      - name: Lint
        run: ruff check hyperdata_terminal/ tests/ run_api.py run_dashboard.py

      - name: Dependency vulnerability audit
        # Blocking: a known CVE in a pinned runtime dep fails CI. Dependabot
        # (.github/dependabot.yml) keeps the lockfile and action SHAs fresh.
        # The hashed lock is audited as pinned (no resolution at audit time),
        # so what is audited is exactly what the lock leg installs.
        run: pip-audit --require-hashes --disable-pip -r requirements.lock

      - name: Test imports
        run: |
          python -c "from hyperdata_terminal.data_layer.hub import HyperDataHub; print('hub: OK')"
          python -c "from hyperdata_terminal.strategies import Strategy, Signal, PaperTrader; print('strategies: OK')"
          python -c "from hyperdata_terminal.strategies.llm_agent import LLMAgent; print('llm: OK')"
          python -c "from hyperdata_terminal.dashboards.liquidation_heatmap import LiquidationHeatmapDashboard; print('heatmap: OK')"

      - name: Run tests
        # The full suite, position scanner included — its network calls are
        # mocked; only tests marked `live` need real exchange connections.
        # tests/test_dependency_lock.py asserts the lock satisfies pyproject.
        run: python -m pytest tests/ -q

  package:
    # Build the wheel and install it the way pipx / uvx / PyPI users do: a
    # regular (non-editable) install, run from outside the checkout. This is
    # the path that used to crash with ModuleNotFoundError: run_dashboard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          pip install --require-hashes -r .github/build-requirements.txt
          python -m build

      - name: Install the wheel into a clean venv and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/hyperdata --version
          /tmp/clean/bin/hyperdata-terminal --version
          /tmp/clean/bin/hyperdata --help > /dev/null
          /tmp/clean/bin/hyperdata paper --help > /dev/null
          /tmp/clean/bin/hyperdata verify --help > /dev/null
          /tmp/clean/bin/hyperdata alerts > /dev/null
          set +e; /tmp/clean/bin/hyperdata alerts --test > /dev/null 2>&1; code=$?; set -e
          if [ "$code" != "2" ]; then echo "alerts --test without channels exited $code, expected 2"; exit 1; fi
          /tmp/clean/bin/python -m hyperdata_terminal --version
          /tmp/clean/bin/python -c "import hyperdata_terminal.cli, hyperdata_terminal.terminal, hyperdata_terminal.mcp_server, hyperdata_terminal.api_server, hyperdata_terminal.verify_data, hyperdata_terminal.strategies.paper_trader, hyperdata_terminal.strategies.llm_agent, hyperdata_terminal.data_layer.hub"
          site=$(/tmp/clean/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          for stray in src config; do
            if [ -e "$site/$stray" ]; then echo "wheel installs a top-level '$stray' package"; exit 1; fi
          done
