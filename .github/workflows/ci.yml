name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      # Actions pinned by commit SHA (not mutable tags) so a compromised tag
      # can't inject code into CI.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5

      - name: Install dependencies
        # requirements.lock pins the runtime deps; -e . adds the package itself.
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
          pip install pytest pytest-asyncio ruff pip-audit

      - name: Lint
        run: ruff check src/ tests/

      - name: Dependency vulnerability audit
        # Advisory: a newly-published CVE in a pinned dep should be visible
        # without failing unrelated PRs. Review failures in the job log.
        continue-on-error: true
        run: pip-audit -r requirements.lock

      - name: Test imports
        run: |
          python -c "from src.data_layer.hub import HyperDataHub; print('hub: OK')"
          python -c "from src.strategies import Strategy, Signal, PaperTrader; print('strategies: OK')"
          python -c "from src.strategies.llm_agent import LLMAgent; print('llm: OK')"
          python -c "from src.dashboards.liquidation_heatmap import LiquidationHeatmapDashboard; print('heatmap: OK')"

      - name: Run tests
        # The full suite, position scanner included — its network calls are
        # mocked; only tests marked `live` need real exchange connections.
        run: python -m pytest tests/ -q
