name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        # "lock": the pinned set from requirements.lock (reproducible).
        # "pyproject": plain `pip install -e .` — exactly what the README
        # tells a user to run. Both must pass. The lock leg used to install
        # the package with dependency resolution disabled, which hid that the
        # lock contradicted pyproject.toml; it now resolves, and `pip check`
        # below fails on any conflict.
        install: ["lock"]
        include:
          - python-version: "3.13"
            install: "pyproject"

    steps:
      # Actions pinned by commit SHA (not mutable tags) so a compromised tag
      # can't inject code into CI.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (${{ matrix.install }})
        # Test tooling is pinned so CI is deterministic.
        run: |
          if [ "${{ matrix.install }}" = "lock" ]; then
            pip install -r requirements.lock
          fi
          pip install -e .
          pip install pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.15.20 pip-audit==2.10.1

      - name: Verify the installed set is consistent
        # Fails on any dependency conflict — e.g. a lock pin outside the
        # range pyproject.toml declares.
        run: pip check

      - name: Lint
        run: ruff check src/ tests/

      - name: Dependency vulnerability audit
        # Blocking: a known CVE in a pinned runtime dep fails CI. Dependabot
        # (.github/dependabot.yml) keeps the lockfile and action SHAs fresh.
        run: pip-audit -r requirements.lock

      - name: Test imports
        run: |
          python -c "from src.data_layer.hub import HyperDataHub; print('hub: OK')"
          python -c "from src.strategies import Strategy, Signal, PaperTrader; print('strategies: OK')"
          python -c "from src.strategies.llm_agent import LLMAgent; print('llm: OK')"
          python -c "from src.dashboards.liquidation_heatmap import LiquidationHeatmapDashboard; print('heatmap: OK')"

      - name: Run tests
        # The full suite, position scanner included — its network calls are
        # mocked; only tests marked `live` need real exchange connections.
        # tests/test_dependency_lock.py asserts the lock satisfies pyproject.
        run: python -m pytest tests/ -q
